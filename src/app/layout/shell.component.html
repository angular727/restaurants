<div class="shell" [class.is-collapsed]="collapsed()" [class.is-mobile-open]="mobileOpen()">
  <!-- Sidebar -->
  <aside class="sidebar" aria-label="Main navigation">
    <div class="sidebar-brand">
      <span class="logo-mark"><svg viewBox="0 0 32 32" width="18" height="18" fill="currentColor"><path d="M11.2 7c.44 0 .8.36.8.8v6.4a2.4 2.4 0 0 1-1.6 2.264V24.2a.8.8 0 0 1-1.6 0v-7.736A2.4 2.4 0 0 1 7.2 14.2V7.8a.8.8 0 0 1 1.6 0v5.6h.8V7.8a.8.8 0 0 1 1.6 0v5.6h.8V7.8c0-.44.36-.8.8-.8Z"/><path d="M22.2 7c.44 0 .8.36.8.8v6.75c0 1.36-.86 2.52-2.07 2.96V24.2a.8.8 0 0 1-1.6 0v-6.69C18.13 17.07 17.27 15.91 17.27 14.55c0-2.7 1.6-6.75 3.93-7.5.34-.11.7.03.9.32.13.19.1.44-.06.6-1.23 1.24-2.27 3.66-2.27 5.68 0 1.02.63 1.9 1.53 2.26V7.8c0-.44.36-.8.8-.8Z"/></svg></span>
      <span class="brand-text">{{ appName }}</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section" *ngFor="let section of nav()">
        <div class="nav-section-title">{{ section.title }}</div>
        <a
          *ngFor="let item of section.items"
          class="nav-link-item"
          [routerLink]="item.path"
          routerLinkActive="active"
          [attr.title]="collapsed() ? item.label : null"
        >
          <i class="bi {{ item.icon }}"></i>
          <span class="nav-text">{{ item.label }}</span>
        </a>
      </div>
    </nav>
  </aside>

  <div class="sidebar-backdrop" (click)="closeMobile()"></div>

  <!-- Main column -->
  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-btn" (click)="toggleSidebar()" aria-label="Toggle navigation">
        <i class="bi bi-layout-sidebar"></i>
      </button>

      <div class="topbar-title min-w-0">
        <span class="crumb d-none d-sm-inline">{{ restaurantName() }}</span>
        <i class="bi bi-chevron-right crumb-sep d-none d-sm-inline"></i>
        <span class="fw-semibold text-truncate">{{ pageTitle() }}</span>
      </div>

      <div class="topbar-actions">
        <!-- Restaurant switcher -->
        <div class="dropdown" *ngIf="auth.restaurants().length > 1">
          <button class="btn btn-light border btn-sm dropdown-toggle d-flex align-items-center gap-2" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-shop"></i>
            <span class="d-none d-md-inline text-truncate" style="max-width: 160px">{{ restaurantName() }}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><h6 class="dropdown-header">Switch restaurant</h6></li>
            <li *ngFor="let r of auth.restaurants()">
              <button class="dropdown-item d-flex align-items-center justify-content-between gap-3" type="button" (click)="switchRestaurant(r.tenantId)">
                <span>
                  <span class="d-block fw-medium">{{ r.name }}</span>
                  <span class="d-block text-muted text-xs">{{ r.role | label }}</span>
                </span>
                <i *ngIf="r.tenantId === auth.tenantId()" class="bi bi-check2 text-primary"></i>
              </button>
            </li>
          </ul>
        </div>

        <!-- User menu -->
        <div class="dropdown">
          <button class="user-btn" data-bs-toggle="dropdown" aria-expanded="false">
            <span class="user-avatar">{{ initials() }}</span>
            <span class="d-none d-md-flex flex-column align-items-start lh-sm min-w-0">
              <span class="fw-semibold text-truncate user-name">{{ roleLabel(auth.role()) }}</span>
            </span>
            <i class="bi bi-chevron-down text-muted text-xs d-none d-md-inline"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end user-menu">
            <li class="px-3 py-2">
              <div class="fw-semibold">{{ auth.user()?.name }}</div>
              <div class="text-muted text-xs text-truncate">{{ auth.user()?.email }}</div>
              <span class="pill pill-primary mt-2">{{ roleLabel(auth.role()) }}</span>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li *ngIf="auth.restaurants().length > 1">
              <a class="dropdown-item" routerLink="/select-restaurant"><i class="bi bi-shop me-2"></i>All restaurants</a>
            </li>
            <li>
              <button class="dropdown-item text-danger" type="button" (click)="auth.logout()">
                <i class="bi bi-box-arrow-right me-2"></i>Sign out
              </button>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
